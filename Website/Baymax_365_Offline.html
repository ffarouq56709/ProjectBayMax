<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Faisal Farouq's 365-day build notebook for ProjectBayMax, a friendly caregiver-support research robot.">
  <meta name="theme-color" content="#fbf6ec">
  <title>Baymax 365 · Build notebook</title>
  <link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PGNpcmNsZSBjeD0iMzIiIGN5PSIzMiIgcj0iMzAiIGZpbGw9IiNmZmZkZjgiIHN0cm9rZT0iI2U5ZTBjZiIgc3Ryb2tlLXdpZHRoPSIzIi8+PHBhdGggZD0iTTE5IDMyaDI2IiBzdHJva2U9IiMzYjQwM2UiIHN0cm9rZS13aWR0aD0iMyIvPjxjaXJjbGUgY3g9IjE5IiBjeT0iMzIiIHI9IjUuNSIgZmlsbD0iIzNiNDAzZSIvPjxjaXJjbGUgY3g9IjQ1IiBjeT0iMzIiIHI9IjUuNSIgZmlsbD0iIzNiNDAzZSIvPjwvc3ZnPgo=">
  <style>:root{
  --paper:#fbf6ec;--card:#fffdf8;--ink:#2b3330;--soft-ink:#46524d;--muted:#6f7a73;--line:#e9e0cf;--rule:#efe7d6;
  --mint:#dcefe5;--mint-deep:#c4e3d4;--mint-ink:#2c6b5d;--teal:#2f8a7d;--teal-dark:#236e63;
  --blush:#f7e0dc;--blush-deep:#f0cbc5;--blush-ink:#9b4a45;--red:#a63c36;--red-bg:#fbe9e6;
  --charcoal:#3b403e;--radius:18px;--shadow:0 2px 0 #eadfca,0 8px 24px #6b5a3a0d;
  --hand:"Bradley Hand","Chalkboard SE","Segoe Print","Comic Sans MS","Comic Neue",cursive;
  --round:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Nunito","Segoe UI",system-ui,sans-serif;
  --body:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);background-image:repeating-linear-gradient(180deg,transparent 0 31px,var(--rule) 31px 32px);color:var(--ink);font:16px/1.6 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--teal-dark)}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:3px solid var(--teal);outline-offset:3px;border-radius:6px}
h1,h2,h3,h4,p{margin:0}
h1{font-family:var(--hand);font-weight:700;font-size:2.1rem;line-height:1.2;letter-spacing:-.01em}
h2{font-family:var(--round);font-size:1.15rem;font-weight:700;line-height:1.35}
h3{font-family:var(--round);font-size:1rem;font-weight:700}
code{font:.86em/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#f3ecdd;padding:1px 6px;border-radius:6px;overflow-wrap:anywhere}
label{display:block}
input,select,textarea{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;max-width:100%;width:100%}
textarea{resize:vertical;min-height:120px;line-height:1.6}
input[type=checkbox]{accent-color:var(--teal);width:22px;height:22px;flex:0 0 auto;margin:2px 0 0;cursor:pointer;padding:0}
button:disabled{opacity:.5;cursor:not-allowed}
.hidden{visibility:hidden}
.skip{position:fixed;top:-60px;left:16px;z-index:100;background:var(--teal);color:#fff;padding:10px 14px;border-radius:10px}
.skip:focus{top:10px}

/* sidebar */
.sidebar{position:fixed;inset:0 auto 0 0;width:256px;background:var(--card);border-right:1.5px solid var(--line);padding:26px 18px 18px;display:flex;flex-direction:column;z-index:40;overflow-y:auto}
.brand{display:flex;gap:12px;align-items:center;padding:0 8px 26px;color:var(--ink);text-decoration:none}
.brand-text{font-family:var(--hand);font-size:1.7rem;font-weight:700;line-height:1}
.brand-num{color:var(--teal)}
.brand small{display:block;font:600 .7rem/1.3 var(--round);letter-spacing:.08em;color:var(--muted);margin-top:6px;text-transform:uppercase}
.robot-mark{display:inline-flex;align-items:center;justify-content:center;background:#fff;width:48px;height:48px;border:1.5px solid var(--line);border-radius:50%;flex:0 0 auto;box-shadow:inset 0 -3px 0 #f1eadc}
.robot-mark i{height:8px;width:8px;border-radius:50%;background:var(--charcoal);display:block}
.robot-mark b{height:2px;width:15px;background:var(--charcoal);display:block}
.sidebar-label{font:700 .72rem var(--round);letter-spacing:.1em;color:var(--muted);padding:0 12px 8px;text-transform:uppercase}
nav{display:grid;gap:4px}
.nav-link{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;font:600 .95rem var(--round);color:var(--soft-ink);text-decoration:none}
.nav-link:hover{background:#f6f0e3}
.nav-link.active{background:var(--mint);color:var(--mint-ink)}
.nav-link svg{width:20px;height:20px;flex:0 0 auto;stroke-width:1.8}
.nav-count{margin-left:auto;font-size:.75rem;padding:1px 7px;border-radius:999px;background:#fff;color:var(--muted)}
.sidebar-progress{margin-top:24px;border-top:1.5px dashed var(--line);padding:20px 12px}
.eyebrow{font:700 .75rem/1.4 var(--round);letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.progress-number{font:700 1.9rem/1.3 var(--round);margin-top:4px}
.progress-number span{font-size:.85rem;font-weight:500;color:var(--muted)}
.meter{height:8px;background:#efe7d6;border-radius:99px;overflow:hidden;margin:10px 0}
.meter>span{display:block;background:var(--teal);height:100%;border-radius:99px;transition:width .25s}
.sidebar-progress small{display:block;font-size:.82rem;color:var(--muted)}
.sidebar-bottom{display:flex;gap:10px;align-items:center;border-top:1.5px dashed var(--line);padding-top:16px;margin-top:auto}
.avatar{background:var(--blush);border-radius:50%;height:36px;width:36px;display:grid;place-items:center;font:700 .8rem var(--round);color:var(--blush-ink)}
.sidebar-bottom strong{display:block;font-size:.9rem}
.sidebar-bottom small{display:block;font-size:.78rem;color:var(--muted)}
.storage-caption{font-size:.78rem;color:var(--muted);line-height:1.5;margin:12px 0 0 4px}

/* top + layout */
.workspace{margin-left:256px;min-width:0}
.topbar{min-height:64px;padding:10px 36px;border-bottom:1.5px solid var(--line);background:#fffdf8e6;backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:30}
.top-breadcrumb{display:flex;align-items:center;gap:8px;font:600 .9rem var(--round);color:var(--muted);min-width:0}
.status-dot{width:9px;height:9px;border-radius:50%;background:var(--teal);flex:0 0 auto}
.divider{color:#c9bfa9}
.top-actions{display:flex;gap:10px;align-items:center}
.icon-button{border:1.5px solid var(--line);background:#fff;border-radius:12px;height:40px;min-width:40px;font-size:1.1rem;padding:0 10px}
.mobile-menu{display:none}
main{max-width:1400px;margin:auto;padding:30px 36px 48px;min-height:calc(100vh - 130px)}
main:focus{outline:none}
.app-footer{padding:16px 36px;border-top:1.5px solid var(--line);font-size:.82rem;color:var(--muted)}
.button{border:1.5px solid var(--teal);border-radius:14px;background:var(--teal);color:#fff;padding:10px 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 .95rem var(--round);line-height:1.4;text-decoration:none;transition:background .15s}
.button:hover{background:var(--teal-dark)}
.button.ghost{color:var(--ink);background:#fff;border-color:var(--line)}
.button.ghost:hover{background:#f7f1e4}
.button.small{font-size:.85rem;padding:8px 13px}
.button.text{background:none;border-color:transparent;color:var(--teal-dark);padding-left:0;padding-right:0}
.button svg{width:16px;height:16px}
.button-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}

/* page head */
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px}
.page-head .eyebrow{margin-bottom:8px}
.day-num{font-family:var(--round);font-weight:500;color:var(--muted);font-size:.8em;margin-right:4px}
.head-description{font-size:1.05rem;color:var(--soft-ink);margin-top:10px;max-width:760px}
.head-tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:5px;font:700 .82rem var(--round);padding:4px 11px;border-radius:999px;background:#f1eadb;color:var(--soft-ink);white-space:nowrap}
.pill.green{background:var(--mint);color:var(--mint-ink)}
.pill.blush{background:var(--blush);color:var(--blush-ink)}
.pill.red{background:var(--red-bg);color:var(--red)}

/* record strip */
.record-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.record-cell{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);padding:14px 18px;box-shadow:var(--shadow)}
.record-cell:nth-child(1){background:#fff}
.record-cell:nth-child(2){background:var(--mint)}
.record-cell:nth-child(3){background:var(--blush)}
.record-cell.muted-cell{background:#f7f1e5}
.stat-label{font:700 .75rem var(--round);letter-spacing:.06em;text-transform:uppercase;color:var(--soft-ink)}
.stat-value{font:700 1.15rem/1.4 var(--round);margin-top:4px}
.stat-value em{font-size:.85rem;font-style:normal;font-weight:500;color:var(--muted)}
.stat-pill{margin-top:6px}
.stat-note{font-size:.82rem;color:var(--soft-ink);margin-top:4px}

.notice{padding:14px 18px;border:1.5px solid #ecd9b5;background:#fff6e4;border-radius:16px;font-size:.95rem;margin-bottom:16px}
.notice.mint{background:var(--mint);border-color:var(--mint-deep)}
.notice.blush{background:var(--blush);border-color:var(--blush-deep)}
.blocker-list{margin:8px 0;padding-left:20px}

/* day layout */
.day-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.panel+.panel{margin-top:16px}
.panel-heading{padding:16px 20px;border-bottom:1.5px dashed var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.panel-heading .count{font-size:.82rem;color:var(--muted)}
.panel-body{padding:18px 20px}
.task-step{padding:16px 20px;display:flex;gap:14px;border-bottom:1.5px dashed var(--rule);cursor:pointer}
.task-step:last-child{border:0}
.step-copy{flex:1;min-width:0}
.step-meta{display:flex;justify-content:space-between;gap:10px;margin-bottom:4px}
.step-number{font:700 .85rem var(--round);color:var(--teal-dark);background:var(--mint);border-radius:999px;min-width:26px;height:26px;display:inline-grid;place-items:center}
.step-time{font:600 .82rem var(--round);color:var(--muted)}
.step-copy p{font-size:1rem;line-height:1.65;color:var(--ink)}
.task-step.done{background:#f6fbf8}
.task-step.done .step-copy p{color:var(--muted);text-decoration:line-through;text-decoration-color:#9bc9b8}
.progress-line{display:flex;align-items:center;gap:10px}
.progress-line .meter{width:110px;margin:0}
.progress-line span{font:600 .85rem var(--round);color:var(--muted)}
.calc-panel{background:#fff}
.calc-panel h3,.help-panel h3{margin-bottom:6px}
.calc{font:500 .98rem/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--soft-ink);overflow-wrap:anywhere}
.help-panel{background:var(--blush);border-color:var(--blush-deep)}
.check-row{display:flex;gap:12px;align-items:flex-start;padding:8px 0;font-size:1rem;cursor:pointer}
.stop-details{margin-top:12px;border-top:1.5px dashed var(--line);padding-top:10px}
.stop-details summary{cursor:pointer;font:700 .95rem var(--round);color:var(--blush-ink)}
.stop-details p{margin-top:6px;color:var(--soft-ink)}
.alternative{margin-top:14px;background:#fff6e4;border-radius:14px;padding:14px 16px}
.alternative ol{margin:8px 0;padding-left:20px}
.notes-label{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.muted-small{font-size:.82rem;color:var(--muted)}
.saved-outcome{background:var(--mint);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.saved-outcome.blocked{background:var(--blush)}
.outcome-meta{font-size:.88rem;color:var(--soft-ink);margin-top:4px;overflow-wrap:anywhere}
.outcome-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.wide-field{grid-column:1/-1}
.field-label{display:block;font:700 .82rem var(--round);color:var(--soft-ink);margin-bottom:4px}
.form-error{color:var(--red);font-size:.9rem;margin-top:8px;min-height:1px}
.save-row{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.hw-panel{border-color:var(--blush-deep)}
.hw-panel .panel-heading{background:var(--blush)}
.side-section{padding:16px 18px}
.side-section+.side-section{border-top:1.5px dashed var(--line)}
.side-section h3{margin-bottom:8px}
.side-section p,.side-section li{font-size:.92rem;color:var(--soft-ink);overflow-wrap:anywhere}
.side-section ul{padding-left:18px;margin:0}
.side-section li+li{margin-top:6px}
.tight{margin-top:8px!important}
.mini-week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}
.mini-day{border:1.5px solid var(--line);background:#fff;border-radius:10px;min-height:36px;font:600 .82rem var(--round);color:var(--soft-ink);display:grid;place-items:center;text-decoration:none}
.mini-day.selected{background:var(--teal);color:#fff;border-color:var(--teal)}
.mini-day.passed{background:var(--mint)}
.mini-day.blocked{background:var(--blush)}
.output-file{background:var(--mint);border-radius:12px;padding:10px 12px;font:.85rem/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow-wrap:anywhere;color:var(--mint-ink)}
.daily-nav{display:flex;justify-content:space-between;gap:8px;padding:12px 16px;border-top:1.5px dashed var(--line)}
.tag-list{display:flex;flex-wrap:wrap;gap:6px}
.tag{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px;font:600 .8rem var(--round);color:var(--soft-ink)}
.next-box{margin-top:12px;background:#f7f1e4;border-radius:12px;padding:10px 12px;font-size:.9rem}
.next-box strong{display:block;font-family:var(--round)}
.inline-day{text-decoration:underline dotted}

/* plan list */
.search-tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.search-tools select{width:auto;flex:0 1 auto}
.search-field{flex:1 1 280px;position:relative}
.search-field svg{position:absolute;left:12px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--muted)}
.search-field input{padding-left:38px}
.week-card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden}
.week-card summary{display:flex;align-items:center;gap:12px;padding:14px 18px;cursor:pointer;list-style:none;flex-wrap:wrap}
.week-card summary::-webkit-details-marker{display:none}
.week-index{font:700 .85rem var(--round);background:var(--mint);color:var(--mint-ink);border-radius:10px;padding:3px 9px}
.week-caption{color:var(--muted);font-size:.88rem;margin-left:auto}
.week-arrow{transition:transform .2s;color:var(--muted)}
.week-card[open] .week-arrow{transform:rotate(90deg)}
.plan-day{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1.5px dashed var(--rule);padding:12px 18px}
.plan-day:hover{background:#faf5ea}
.plan-day small{display:block;color:var(--muted);font-size:.84rem;overflow-wrap:anywhere}
.day-index{font:700 .9rem var(--round);color:var(--teal-dark)}
.day-length{font:600 .84rem var(--round);color:var(--muted);white-space:nowrap}
.empty{padding:20px;color:var(--muted)}

/* roadmap, reviews, library, controls */
.roadmap-grid,.review-grid,.document-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.roadmap-card,.review-card,.document-card,.control-stat{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.roadmap-card h3,.review-card h3{margin:6px 0}
.roadmap-card p,.review-card p,.document-card p,.control-stat p{font-size:.9rem;color:var(--soft-ink)}
.roadmap-card .bottom{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--muted)}
.section-heading{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:28px 0 12px;flex-wrap:wrap}
.days-covered{font-size:.88rem;color:var(--muted)}
.phase-summary{display:flex;flex-wrap:wrap;gap:8px}
.section-description{color:var(--soft-ink);margin-top:12px}
.review-top{display:flex;justify-content:space-between;align-items:center}
.review-id{font:700 1rem var(--round);background:var(--blush);color:var(--blush-ink);border-radius:10px;padding:2px 10px}
.review-card .button{margin-top:10px}
.document-card{display:flex;gap:12px}
.doc-icon{background:var(--mint);border-radius:12px;width:40px;height:40px;display:grid;place-items:center;flex:0 0 auto;color:var(--mint-ink)}
.doc-icon svg{width:20px;height:20px}
.document-card a{font-weight:700;font-size:.9rem}
.artifact-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.artifact-button{display:flex;gap:10px;align-items:center;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;font-size:.92rem}
.artifact-button span:first-child{font:700 .82rem var(--round);color:var(--teal-dark)}
.source-item{font-size:.9rem;padding:10px 0;border-bottom:1.5px dashed var(--rule)}
.source-item strong{display:block}
.register-record{padding:14px 0;border-bottom:1.5px dashed var(--rule)}
.register-record p{margin:6px 0;color:var(--soft-ink)}
.controls-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:16px}
.table-scroll{overflow-x:auto;background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:10px 14px;border-bottom:1.5px dashed var(--rule);vertical-align:top}
th{font:700 .8rem var(--round);text-transform:uppercase;letter-spacing:.05em;color:var(--soft-ink);background:#f7f1e4}
td small{display:block;color:var(--muted);font-size:.8rem;margin-top:2px}
.number{text-align:right;white-space:nowrap}
.settings-section+.settings-section{border-top:1.5px dashed var(--line);margin-top:18px;padding-top:18px}
.settings-section p{color:var(--soft-ink);margin:6px 0}
.settings-section form label{max-width:260px}

dialog{border:1.5px solid var(--line);border-radius:22px;padding:0;max-width:min(720px,calc(100vw - 24px));width:100%;background:var(--card);color:var(--ink);box-shadow:0 20px 60px #3a2e1a33}
dialog::backdrop{background:#2b33304d}
.dialog-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px;border-bottom:1.5px dashed var(--line)}
.dialog-content{padding:18px 20px;max-height:75vh;overflow:auto}
.dialog-content p+p{margin-top:10px}
.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,120px);background:var(--charcoal);color:#fff;padding:12px 18px;border-radius:14px;font-size:.92rem;transition:transform .25s;z-index:200;max-width:calc(100vw - 32px)}
.toast.visible{transform:translate(-50%,0)}
.loading{display:grid;place-items:center;gap:12px;padding:80px 0;color:var(--muted)}

@media (max-width:1100px){.day-layout{grid-template-columns:minmax(0,1fr)}}
.day-primary,.day-aside{min-width:0}
.step-copy code{font-size:.88em}
@media (max-width:860px){
  .sidebar{transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 40px #0002}
  .sidebar.open{transform:none}
  .workspace{margin-left:0}
  .mobile-menu{display:inline-flex;align-items:center}
  .topbar{padding:10px 16px}
  main{padding:20px 16px 40px}
  .app-footer{padding:14px 16px}
  .page-head{flex-direction:column}
  .head-tools{justify-content:flex-start}
  .record-strip{grid-template-columns:1fr}
  .outcome-grid{grid-template-columns:1fr}
  h1{font-size:1.75rem}
  .plan-day{grid-template-columns:40px minmax(0,1fr)}
  .day-length{grid-column:2}
  .week-caption{margin-left:0;width:100%}
  .top-breadcrumb .crumb-long{display:none}
}
@media print{.sidebar,.topbar,.app-footer,.head-tools,form,.notes-panel{display:none}.workspace{margin:0}body{background:#fff}}
</style>
  
</head>
<body>

   "body": "The Jacobs Baymax Caregiver Support Robot will help caregivers with companionship, low-risk engagement, fictional record organization and communication. Faisal Farouq remains the accountable project owner. Caregivers retain authority, responsibility and clinical judgment. The robot will identify itself as a research support system and will never claim professional-care or emergency-response authority.\n\nYear 1 is a controlled research demonstration. The target robot is 1.829 m tall and no more than 55 kg in operating configuration. A projection above 55 kg requires rework; above 65 kg requires a major design review. The lower body has 10 active joints. The goal is three consecutive slow tethered steps in each of two separate trials, targeting 0.10-0.15 m/s inside a cleared controlled test area with rated robot fall protection. The financial ceiling is USD 10000; feasibility at either USD 5000 or USD 10000 remains unproven.\n\nThe companion experience will be developed first on a laptop using fictional profiles, simulated observations, games, medication-response logging, audit history, approved-recipient summaries and telepresence handoff. Every simulated reading retains its value, units, source and time. Reports require exact-content preview and explicit send confirmation. Only approved test recipients may receive them. Endpoint receipt never implies human review.\n\nA separate handling demonstration will move a 2 kg inert object through an approved controlled trajectory for 10 supervised repetitions while the robot is stationary and mechanically secured. Walking with the test object is excluded. The handling module is included in onboard mass accounting; the test object is additional only in the stationary configuration.\n\nAppearance follows the written fallback: removable rigid white rounded plastic panels, visible narrow seams, charcoal protected joint gaps, subtle teal, simple connected eyes and broad flat rounded-rectangle feet. Motion clearance, cooling, service access, sensing, stop access and arrest attachments take priority over cosmetic proportions.\n\nExcluded are real patient data, live EHR integration, diagnosis, medical image interpretation, treatment or dose recommendations, dispensing or medication administration, person lifting/support/restraint, unsupervised high-energy motion and unapproved public operation. A 5 kg payload, untethered gait and clinical use are later-phase questions. No physical performance, fabrication, approval or clinical validation is claimed by this baseline."

   },
   "body": "The mechanical load path runs from the removable exterior and upper structures through the pelvis, lower-body joints and feet to the floor. Exterior panels are non-structural unless later drawings explicitly qualify them. The object-handling module has a separate support path and enable condition. Robot arrest and handling fixtures stay effective without controller or battery power.\n\nThe companion model receives only consented fictional context. It proposes typed actions to a deterministic interaction gateway. That gateway can request a curated game, draft a note, request a report preview or request a named bounded motion skill. It cannot open a motor bus, write a database, choose a recipient, change limits or write original medication instructions. Human confirmations bind to the actual proposed revision or transmission. AI-generated text is untrusted until schema and authorization checks pass.\n\nThe care-record and medication-log services own validated transactions. The record service appends corrections with superseded-version links. Audit events record create, view, change, deny and transmit actions. A deterministic summary builder cites source IDs. The model may rephrase a draft only where the final facts are checked against those IDs. Medication instructions remain an immutable original string per human-authorized version.\n\nThe communication service receives an approved immutable report snapshot, recipient ID and approval token bound to its hash. A local outbox owns idempotency and retry states. A mock receiver returns endpoint receipt. Human review is a separate explicit authenticated action. Telepresence requires capture consent and a visible call state. External EHR routes and credentials are absent from the Year 1 deployment.\n\nThe main motion controller owns standing, weight-shift and gait skills. A separate safety controller supervises independently available enable, stop, watchdog and relevant fault signals. E-stop hardware inhibits hazardous drive enable through a reviewed independent path. A diagnostic controller does not become safety-rated by being independent. Required integrity, channels, monitored contacts, brake behavior and fault coverage need qualified review. Torque-off alone does not hold up a biped. Mechanical support and arrest remain mandatory. Reset clears a latch only after fault resolution and never resumes motion automatically.\n\nModules M01 structure, M02 lower actuation, M03 feet/contact, M04 protected power, M05 safety, M06 main compute, M07 perception, M08 companion, M09 records, M10 medication, M11 communication, M12 handling, M13 body, M14 evidence and M15 simulation have distinct ownership of state. Evidence subscribes read-only to timestamped events. Simulation emits a distinctly labeled simulation channel and has no hardware credentials. Safety event logging must survive AI or network failure.\n\nThe candidate joint tree has l_hip_roll, l_hip_pitch, l_knee_pitch, l_ankle_pitch, l_ankle_roll and the corresponding r_ names. With x forward, y left and z up, roll axes are x and pitch axes are y. There is no hip yaw. This supports investigation of straight-line tethered stepping; turning is excluded. Candidate limits and dimensions live in the CAD and simulation specifications and are not operational safety limits."

   "body": "Start each session with the research role and SIMULATED banner. Select a fictional profile and identify the actor role. Ask separately for preference memory, note storage, microphone/camera use and report transmission. A user can decline an activity or withdraw capture consent. If free text appears to contain real personal/health information, pause entry and ask the operator to replace it with fictional fixture data; heuristic detection alone is not a privacy guarantee.\n\nCompanionship flow: offer a consented game, story, music/relaxation or feelings check-in; accept a selection through speech, touch or communication board. Ask for clarification when uncertain. A sensitive concern yields a short supportive response and an offer to contact the approved caregiver. Record a note only after the actor confirms the wording. Child preset uses age-appropriate curated content and guardian-controlled settings; older-adult preset offers slower speech and repetition; rehabilitation preset uses seated verbal/visual activities unless a separate motion script is approved; limited-speech/mobility preset provides large targets, captions and a manual board. No preset authorizes clinical or person-contact motion.\n\nMedication flow: a deterministic reminder displays the exact original instructions for fictional Demo Medication A, instruction version and source. Ask taken, skipped, postponed or no response. Record it as a patient statement, never confirmed ingestion. Postponed does not change the prescribed schedule and the robot supplies no catch-up or double-dose guidance. A scripted skipped/missed response prepares a report. Show recipient and complete contents, then require explicit send confirmation. No confirmation means no outbound message; retain the pending draft. Human-authorized record changes create a new version and preserve the original.\n\nObservation flow: receive only an allowed simulator fixture or actor-entered simulated value. Validate metric type, units, source, observed time and actor; record both observed and recorded time. Show trends as descriptive values, with missing/stale flags and no diagnostic label. A deliberately artificial threshold crossing says: 'This simulated reading crossed the demonstration review rule. I cannot determine what it means. Would you like to contact your approved caregiver?' Show the exact trigger. The fixture uses an intentionally non-clinical test threshold and is never a clinical limit.\n\nStaff communication flow: choose routine summary, caregiver attention requested, immediate human contact requested or system assistance required. Assemble facts, actor statements, robot observations and unknowns as separate fields. Preview exact recipient, time window, simulated readings, medication responses, concerns and robot status. Approval binds to report hash, version and recipient. Altered drafts return to preview. Send only to an allowlisted mock receiver; audit every attempt and use the same idempotency key on retry. Show queued, attempted, endpoint received and separately human reviewed. Timeout displays unconfirmed delivery and a manual call option. No state implies emergency dispatch.\n\nCorrections append a superseding record with reason, actor, before/after version and audit event. Unauthorized reads and changes are denied and audited. Local mock mappings use Observation-like value/time/source records, Provenance-like origin/revision records and AuditEvent-like access events. These borrow structure from HL7 R4 references SRC-06 to 08; they do not claim FHIR conformance or connectivity."

   "body": "The component allocations are in budget/mass_budget.csv. They are design ceilings, not a prediction of the as-built robot. The 14 kg lower-body actuation allocation includes ten modules, transmissions and dedicated actuation mounts. Generic structural brackets belong to the structure line; the later BOM must prevent double counting. External robot arrest, test fixture, floor hardware and the inert payload are outside operating robot mass, but are separately listed and rated. A stationary configuration with the 2 kg object has 57 kg moving/retained robot-plus-object mass at the 55 kg robot target. Walking with that payload is prohibited. Removing a module requires a separately weighed and versioned configuration.\n\nMass growth: 47.8 x 1.20 =57.36 kg before any unused reserve is counted. This exceeds the 55 kg target by 2.36 kg. At 40 percent growth, 47.8 x 1.40 =66.92 kg, exceeding the 65 kg major-review threshold by 1.92 kg. Growth reserve is headroom, not extra hardware and must not be added again to these grown component sums.\n\nPanels: for assumed area A=2.5 m2, thickness t=0.0015 m and density rho=1050 kg/m3, m=A*t*rho=3.9375 kg. Adding 1.2625 kg for panel supports/overlap gives 5.2 kg. Doubling to 0.003 m produces 9.1375 kg, a 3.9375 kg increase. Area, plastic density, process thickness and required impact/fire performance need material selection and actual CAD; large solid-printed shells can exceed this budget.\n\nGravity screen with g=9.81 m/s2 and m=55 kg: W=539.55 N. A horizontal COM offset e=0.10 m from a loaded ankle gives tau=W*e=53.96 N m. At e=0.15 m, tau=80.93 N m. Multiplying by an illustrative dynamic screening factor of 1.5 yields 80.93 and 121.40 N m. This is not a final factor of safety or joint load envelope. It omits link inertia, impacts, compliance and load sharing. A full-body inverse-dynamics trajectory and fault-load cases are required.\n\nFor illustration, a 35 kg effective upper load at a 0.15 m hip lever gives 35*9.81*0.15=51.50 N m static; a 0.20 m knee lever gives 68.67 N m. The same 1.5 screen gives 77.25 and 103.01 N m. The effective mass and lever arms are assumptions. The manufacturer's AK80-64 reference lists 48 N m rated and 120 N m peak (SRC-02). Even the 0.10 m ankle static example exceeds that rated value. Low walking speed does not remove sustained gravitational torque or winding heating. The 120 N m peak value is not a continuous holding rating.\n\nFoot screen: a 0.32 x 0.22 m rectangle has 0.0704 m2 area. A 55 kg single-support load uniformly spread over it gives 7.66 kPa, but real contact area and local pressure differ. The ideal lateral half-width is 0.11 m; an illustrative 0.025 m edge allowance leaves 0.085 m at the same coordinate origin. Dynamic ZMP, friction and contact uncertainties still require simulation and tests; this is no stability proof. Estimated COM height from provisional component centers is computed as sum(m_i*z_i)/sum(m_i); the reserve has no physical location and is excluded until assigned.\n\nHandling screen: a 2 kg object at horizontal reach 0.30 m contributes 2*9.81*0.30=5.886 N m; at 5 kg it contributes 14.715 N m, 2.5 times as much, before module self-weight, motion, friction and safety factors. A counterbalance or independent supported module reduces the biped integration burden. It does not remove the need for structural/retention review.\n\nEnergy screen: assume ten joints each average 40 N m at 0.50 rad/s simultaneously. P_mech=10*40*0.50=200 W. At illustrative efficiency 0.60 plus 60 W electronics, P_bus=200/0.60+60=393.33 W. A 48 V, 8 Ah nominal pack stores 384 Wh=1.3824 MJ. At 80 percent usable energy, ideal runtime is 307.2/393.33=0.781 h=2812 s. This is not a runtime prediction; holding losses, peak loads, temperature, converters, aging and duty cycle are unresolved. Average bus current for this example is 8.19 A. Manufacturer ADC/phase current must not be summed as battery DC current. Peak bus, fuse, conductor, regen and contactor sizing require a reviewed electrical model.\n\nThermal work remains open: compute tau_RMS=sqrt(sum(tau_i^2*dt_i)/sum(dt_i)), convert motor-side torque to current using vendor gearbox efficiency and torque constant conventions, calculate copper/driver loss, and model temperature with measured thermal parameters. No winding resistance convention or peak-duration limit has been assumed sufficient for purchase. Robot arrest sizing likewise cannot use W alone: a simple energy screen F_avg approximately m*g*(1+h/d) excludes peak amplification and rig geometry and is intentionally not used to select rated equipment."

   "body": "Severity uses 1 negligible harm, 2 minor reversible injury or inconvenience, 3 serious injury or substantial privacy harm, and 4 fatal/permanent injury or potentially severe care-related misuse. These are conservative consequence categories for screening, not a quantified clinical risk analysis. Likelihood is UNASSESSED for every record. P0 means the relevant release is blocked until the control is verified and reviewed; P1 means resolve before the relevant demonstration stage. Neither category estimates probability.\n\nThe complete register is risk_records/hazards.csv and the Hazards workbook tab. Faisal Farouq is accountable for disposition and appointments, not presumed qualified to sign every specialized design. Reviewer fields contain roles marked unassigned; they do not invent professional sign-off. Residual risk remains UNASSESSED and acceptance NOT RECORDED throughout R0.1.\n\nStop design needs explicit gravity behavior. Removing motor power can cause collapse. The physical safety case must show how the arrest/support retains the robot and object without battery, compute, network or a held torque command. A safety relay, contactor or independent microcontroller alone does not establish the integrity of the whole function. The safety reviewer must define and validate response time, fault detection, reset behavior, limits and retained-load behavior.\n\nISO 13482 and ISO 13850 official abstracts are design-review references (SRC-03/04). No paid full-standard assessment, compliance claim, certification or regulatory determination is made. Recheck applicable editions and jurisdiction at the architecture gate. Friendly styling increases the need for clear boundaries because spectators may approach or touch the robot. Year 1 physical demonstrations use barriers and scripted adult operators; they are not patient trials. No contact-force number has been borrowed from a different robot standard to imply that this full-size biped is safe for contact."

   },
   "body": "Workstream A maintains requirements, safety/ethical risks, assumptions, decisions, access matrix, verification and excluded claims throughout the year. Faisal Farouq chairs owner decisions; independently qualified people review specialized engineering. A document status PASS is not a physical release.\n\nWorkstream B builds the companion and caregiver laptop experience in months 1-3, then tests and refines it through month 12. Complete fictional-data, medication, consent, summary, audit and communication failure tests before connection to any robot. This work can progress while mechanical feasibility remains open, using confirmed available equipment and no unapproved spending.\n\nWorkstream C develops the master CAD skeleton, five-joint-per-leg candidate, feet, load cases, mass/COM/inertias, protected power, safety stop behavior and panel schedule in months 2-4. Workstream D develops the pinned-version MuJoCo model concurrently using the same names/axes/limits and documented mass/inertia estimates. Standing, weight-shift and three-step sweeps include friction, delay, backlash, thermal/duty constraints and failure injection. The simulator includes a calibrated tether approximation; its assistance is logged. Nothing here claims those models or simulations have been executed.\n\nWorkstream E prepares quotes and interface/inspection packages in months 3-5, with expensive orders blocked until G3. If no credible whole-system route fits USD 10000, the owner must retain the cap and revise resources, design or schedule through a recorded decision. The walking commitment is not silently removed, and a budget increase is not implied. Fabrication starts only at G4 with a named qualified shop and released drawings.\n\nWorkstream F follows the exact staged order: 1 software-only caregiver demonstration; 2 sensors; 3 individual actuator module; 4 power system; 5 safety controller and stops; 6 one joint; 7 one leg on fixture; 8 lower-body structure without walking; 9 supported standing; 10 weight shifting; 11 one tethered step; 12 three consecutive tethered steps; 13 repeated three-step sequence; 14 stationary supported handling; 15 shell clearance/thermal testing; 16 full caregiver-support demonstration. Each stage has separate evidence and a release for the next. Simulation evidence before purchasing is distinct from physical powered-actuator acceptance after receipt.\n\nIndicative timing: G0 month 1; G1 months 1-3; G2 months 2-4; G3 months 4-5; G4 months 5-6; G5 months 6-8; G6 months 8-10; G7 months 10-11; G8 month 12. Relative timing starts only when G0 is accepted. Staffing and lead times are unknown, so this is a dependency plan, not a promise of a completed full-size biped in one year.\n\nAt G8 archive the accepted requirements, as-built BOM/drawings, actual spend, configuration hashes, calibrated logs, approved protocols, raw failures, verified outcomes and limitations. A software-only fallback may be shown when motion gates are blocked, labeled as partial completion. No public demonstration is the first test of two hazardous subsystems together."
  }
 ],
 "kinds": {
  "desk": "Desk work",
  "software": "Software on your laptop",
  "simulation": "Simulation only",
  "procurement": "Quotes and orders",
  "physical": "Hands-on, no power",
  "powered": "Powered test (permit + second person)",
  "review": "Review with outside help"
 }
}</script>
<script>'use strict';
(() => {
const KEY = 'jacobs-baymax-365-r02'; // unchanged so existing browser progress loads
const PLAN_REV = 'R0.3';
let D, S, view = 'day', selected = 1, planQuery = '', planPhase = '', planStatus = '', planMonth = '', registryQuery = '', registry = 'requirements', toastTimer, storageOK = true;
const $ = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icons = {
  day:'<rect x="4" y="4" width="16" height="16" rx="5"/><path d="m8 12 3 3 5-6"/>',
  plan:'<rect x="3" y="5" width="18" height="16" rx="4"/><path d="M7 3v4m10-4v4M3 10h18m-13 4h1m6 0h1m-8 4h1m6 0h1"/>',
  roadmap:'<path d="M5 20V4m0 1h13l-3 4 3 4H5"/>',
  reviews:'<path d="M12 3 4 6v6c0 5 8 9 8 9s8-4 8-9V6z"/><path d="m8 12 3 3 5-6"/>',
  resources:'<path d="M5 3h9l5 5v13H5zM14 3v6h5M8 13h8m-8 4h8"/>',
  controls:'<path d="M4 20V10m8 10V4m8 16v-7M1 10h6m2-6h6m2 9h6"/>',
  search:'<circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/>',
  arrow:'<path d="M5 12h14m-5-5 5 5-5 5"/>',
  download:'<path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/>'
};
const icon = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[n] || icons.resources}</svg>`;
const money = v => typeof v === 'number' && Number.isFinite(v) ? new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(v) : 'Not entered';
const num = (v,p=1) => typeof v === 'number' && Number.isFinite(v) ? v.toFixed(p) : 'Not entered';
const fmtDate = date => new Intl.DateTimeFormat('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'}).format(date);
const parseDate = s => { const [y,m,d] = String(s).split('-').map(Number); return new Date(y,m-1,d,12); };
const isoDate = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const dateAt = (n,start=S.start) => { const d = parseDate(start); d.setDate(d.getDate()+n-1); return d; };
const todayISO = () => new Intl.DateTimeFormat('en-CA',{timeZone:'America/Los_Angeles',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const calendarDay = () => { const a = parseDate(S.start), b = parseDate(todayISO()); return Math.max(1,Math.min(365,1+Math.round((Date.UTC(b.getFullYear(),b.getMonth(),b.getDate())-Date.UTC(a.getFullYear(),a.getMonth(),a.getDate()))/86400000))); };
const hm = m => `${Math.floor(m/60)} h${m%60 ? ' '+(m%60)+' min' : ''}`;
const cap = () => D.meta.cashCap || 10000;
const months = () => Array.from({length:12},(_,i)=>{const start=parseDate(S.start);const make=k=>{const y=start.getFullYear(),m=start.getMonth()+k;return new Date(y,m,Math.min(start.getDate(),new Date(y,m+1,0).getDate()),12);};const a=make(i),b=make(i+1);b.setDate(b.getDate()-1);const dayDiff=x=>1+Math.round((Date.UTC(x.getFullYear(),x.getMonth(),x.getDate())-Date.UTC(start.getFullYear(),start.getMonth(),start.getDate()))/86400000);return {id:i+1,start:Math.max(1,dayDiff(a)),end:Math.min(365,dayDiff(b)),a,b};});

function blankState(){
  const ref = D.meta.costReferences || {};
  return {version:2,start:D.meta.defaultStart,days:{},gates:{},stages:{},
    costs:Object.fromEntries(D.budget.map(r=>[r[0],{forecast:ref[r[0]]?ref[r[0]].forecast:r[2]*r[3],actual:null,kind:r[0]==='B-14'?'reserve':'allowance',reference:ref[r[0]]?ref[r[0]].basis:'',updated:''}])),
    masses:Object.fromEntries(D.mass.map(r=>[r[0],{estimate:null,measured:null,reference:'',updated:''}]))};
}
function dayState(n){
  const d = D.days[n-1];
  let r = S.days[n];
  if(!r) r = S.days[n] = {steps:[],checks:[],notes:'',result:'',evidence:'',reviewer:'',hours:'',recordedAt:'',history:[],planRev:PLAN_REV};
  if(r.planRev !== PLAN_REV){
    // Steps and checks were rewritten in R0.3. Keep the old ticks; never drop notes or outcomes.
    if((r.steps||[]).some(Boolean)||(r.checks||[]).some(Boolean)) r.legacy = {rev:r.planRev||'R0.2',steps:r.steps,checks:r.checks};
    r.steps = []; r.checks = []; r.planRev = PLAN_REV;
  }
  r.steps = Array.from({length:d.steps.length},(_,i)=>r.steps[i]===true);
  r.checks = Array.from({length:d.acceptance.length},(_,i)=>r.checks[i]===true);
  if(!r.hw) r.hw = {result:'',run:'',date:'',notes:''};
  if(!Array.isArray(r.history)) r.history = [];
  return r;
}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S));storageOK=true;}catch{storageOK=false;$('storage-caption').textContent='Browser storage unavailable. Export a backup before leaving.';}}
function load(){const init=blankState();try{const raw=localStorage.getItem(KEY);if(raw){const x=JSON.parse(raw);if(x.version===2&&validDate(x.start)){Object.assign(init,{start:x.start,days:x.days||{},gates:x.gates||{},stages:x.stages||{}});for(const [id,r] of Object.entries(x.costs||{}))if(id in init.costs)init.costs[id]={...init.costs[id],...r};for(const [id,r] of Object.entries(x.masses||{}))if(id in init.masses)init.masses[id]={...init.masses[id],...r};}}}catch{storageOK=false;}return init;}
function validDate(s){return /^\d{4}-\d{2}-\d{2}$/.test(s)&&isoDate(parseDate(s))===s;}
function toast(t){$('toast').textContent=t;$('toast').classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('visible'),3300);}
const dayCount = () => Object.values(S.days).filter(r=>r.result==='PASS').length;
const hwCount = () => Object.values(S.days).filter(r=>r.hw&&r.hw.result==='PASS').length;
function budgetTotals(){const a=Object.values(S.costs);return {forecast:a.every(r=>Number.isFinite(r.forecast))?a.reduce((s,r)=>s+Math.max(r.forecast,Number.isFinite(r.actual)?r.actual:0),0):null,actual:a.every(r=>Number.isFinite(r.actual))?a.reduce((s,r)=>s+r.actual,0):null};}
function massTotals(){const a=Object.values(S.masses);return {estimate:a.every(r=>Number.isFinite(r.estimate))?a.reduce((s,r)=>s+r.estimate,0):null,measured:a.every(r=>Number.isFinite(r.measured))?a.reduce((s,r)=>s+r.measured,0):null};}
function recordComplete(r){return !!r&&r.result==='PASS'&&r.reviewed===true&&r.checks?.every(Boolean)&&!!r.reviewer?.trim()&&!!r.role?.trim()&&!!r.evidence?.trim()&&validDate(r.date);}
function g3Problems(){const b=budgetTotals(),m=massTotals(),p=[];if(b.forecast===null||b.forecast>cap())p.push(`Complete projected cash cost must fit the ${money(cap())} working cap (final ceiling undecided)`);if(b.actual===null)p.push('Confirm actual spending, including real zeros, on every budget line');if(Object.values(S.costs).some(r=>!['quote','receipt','confirmed resource','reserve'].includes(r.kind)||!r.reference?.trim()))p.push('Replace unquoted allowances with quotes, receipts or confirmed resources');if(m.estimate===null)p.push('Enter all 13 projected mass contributions with sources');else if(m.estimate>55)p.push(`Projected mass ${m.estimate.toFixed(2)} kg exceeds the 55 kg target`);if(Object.values(S.masses).some(r=>!r.reference?.trim()))p.push('Every mass contribution needs a source');return p;}
function gateIssues(id){const g=D.gates.find(g=>g.id===id);if(!g)return ['Unknown gate'];const issues=[];for(const p of g.requires)if(!gateSatisfied(p))issues.push(`${p} has no recorded release`);for(const p of g.stages)if(!stageSatisfied(p))issues.push(`${p} has no accepted test record`);if(id==='G3')issues.push(...g3Problems());return issues;}
function gateSatisfied(id,trail=[]){if(trail.includes('G:'+id))return false;const g=D.gates.find(x=>x.id===id);if(!g||!recordComplete(S.gates[id]))return false;const next=[...trail,'G:'+id];if(!g.requires.every(x=>gateSatisfied(x,next))||!g.stages.every(x=>stageSatisfied(x,next)))return false;if(id==='G3'&&g3Problems().length)return false;return true;}
function stageSatisfied(id,trail=[]){if(trail.includes('S:'+id))return false;const s=D.stages.find(x=>x.id===id);if(!s||!recordComplete(S.stages[id]))return false;const next=[...trail,'S:'+id];return gateSatisfied(s.gate,next)&&s.requires.every(x=>stageSatisfied(x,next));}
function readiness(d){const issues=[];for(const g of d.gates)if(!gateSatisfied(g))issues.push(`${g} · ${D.gates.find(x=>x.id===g)?.name}: no release recorded`);for(const s of d.stages)if(!stageSatisfied(s))issues.push(`${s} · ${D.stages.find(x=>x.id===s)?.name}: prior stage not accepted`);const mass=massTotals();if((d.gates.length||d.stages.length)&&mass.estimate>65)issues.push('Projected mass over 65 kg: major design review first');return issues;}
function pill(result){if(result==='PASS')return '<span class="pill green">PASS</span>';if(result==='BLOCKED')return '<span class="pill red">BLOCKED</span>';if(result==='REWORK')return '<span class="pill blush">REWORK</span>';return '<span class="pill">Not recorded</span>';}
function hwPill(result){if(result==='PASS')return '<span class="pill green">PASS</span>';if(result==='FAIL')return '<span class="pill red">FAIL</span>';if(result==='STOPPED')return '<span class="pill blush">STOPPED</span>';return '<span class="pill">Not run</span>';}
function route(){const [v,n]=location.hash.slice(1).split('/');view=['day','plan','roadmap','reviews','resources','controls','settings','register'].includes(v)?v:'day';if(view==='day')selected=Math.max(1,Math.min(365,Number(n)||1));if(view==='register')registry=['requirements','hazards','verification'].includes(n)?n:'requirements';render();}
function navigate(hash){if(location.hash===hash){route();window.scrollTo(0,0);}else location.hash=hash;$('main').focus({preventScroll:true});document.querySelector('.sidebar').classList.remove('open');}
function render(){const active=view==='register'?'resources':view;const nav=[['day','Today',''],['plan','All 365 days','365'],['roadmap','Year roadmap','12'],['reviews','Reviews & test stages','25'],['controls','Budget & mass',''],['resources','Project library','']];$('navigation').innerHTML=nav.map(([v,t,c])=>`<a class="nav-link ${active===v?'active':''}" ${active===v?'aria-current="page"':''} href="#${v}${v==='day'?'/'+selected:''}">${icon(v)}<span>${t}</span>${c?`<span class="nav-count">${c}</span>`:''}</a>`).join('');$('top-section').textContent=nav.find(x=>x[0]===active)?.[1]||'Settings';updateSide();$('main').innerHTML=({day:renderDay,plan:renderPlan,roadmap:renderRoadmap,reviews:renderReviews,controls:renderControls,resources:renderResources,settings:renderSettings,register:renderRegister}[view])();bindView();}
function updateSide(){const count=dayCount();$('side-progress').innerHTML=`${count} <span>/ 365 days</span>`;$('side-meter').style.width=(count/365*100)+'%';$('side-hw').textContent=`${hwCount()} hardware results recorded`;if(!storageOK)$('storage-caption').textContent='Storage is unavailable. Export a backup before leaving.';}
const heading=(eyebrow,title,description,tools='')=>`<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1>${description?`<p class="head-description">${description}</p>`:''}</div>${tools?`<div class="head-tools">${tools}</div>`:''}</div>`;
const dayLink = n => `<a href="#day/${n}">Day ${String(n).padStart(3,'0')}</a>`;
const linkPaths = t => esc(t).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/day_(\d{3})_/g,(m,k)=>`<a class="inline-day" href="#day/${Number(k)}">day_${k}_</a>`);

function renderDay(){
  const d=D.days[selected-1],r=dayState(selected),issues=readiness(d),done=r.steps.filter(Boolean).length,n=d.steps.length;
  const weekDays=D.days.filter(x=>x.week===d.week);const conditional=!!(d.gates.length||d.stages.length);
  const fr=d.fileRecord;
  return heading(`WEEK ${String(d.week).padStart(2,'0')} · ${esc(d.phase)} · ${esc(d.mode)}`,`<span class="day-num">${String(d.id).padStart(3,'0')}</span> ${esc(d.title)}`,esc(d.goal),`<button class="button ghost small" data-action="today">Go to calendar day ${calendarDay()}</button><button class="button ghost small" data-action="download-day">${icon('download')}Save as Markdown</button>`)+`
  <div class="record-strip">
   <div class="record-cell"><div class="stat-label">Planned date</div><div class="stat-value">${fmtDate(dateAt(d.id))}</div><div class="stat-note">${hm(d.minutes)} planned · from your start date</div></div>
   <div class="record-cell"><div class="stat-label">Task record</div><div class="stat-pill">${pill(r.result)}</div><div class="stat-note">${r.recordedAt?'Recorded '+esc(r.recordedAt.slice(0,10)):'Your own record of today’s task'}</div></div>
   <div class="record-cell ${d.hardwareRecord?'':'muted-cell'}"><div class="stat-label">Hardware result</div><div class="stat-pill">${d.hardwareRecord?hwPill(r.hw.result):'<span class="pill">No hardware today</span>'}</div><div class="stat-note">${d.hardwareRecord?(r.hw.run?'Run '+esc(r.hw.run)+' · '+esc(r.hw.date):'Measured result on the robot, kept separate'):'Desk, software or simulation work'}</div></div>
  </div>
  ${fr?`<div class="notice mint"><strong>In the project files:</strong> Day ${d.id} is recorded as <b>${esc(fr.result)}</b> (${esc(fr.scope)}). Evidence: <code>${esc(fr.evidence)}</code>. This is separate from what you record in this browser.</div>`:''}
  ${r.legacy?`<div class="notice"><strong>Plan updated to R0.3.</strong> Your earlier ${esc(r.legacy.rev)} step ticks are kept in your backup but no longer match these steps. Notes and outcomes are unchanged.</div>`:''}
  ${issues.length?`<div class="notice blush"><strong>Not cleared yet: ${issues.length} prerequisite${issues.length===1?'':'s'} missing.</strong><ul class="blocker-list">${issues.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>Use the desk alternative below today. <a href="#reviews">See reviews →</a></div>`:''}
  <div class="day-layout"><div class="day-primary">
   <section class="panel"><div class="panel-heading"><h2>Do this</h2><div class="progress-line"><div class="meter"><span style="width:${done/n*100}%"></span></div><span id="task-count">${done} of ${n}</span></div></div>
    ${d.steps.map((s,i)=>`<label class="task-step ${r.steps[i]?'done':''}" for="step-${i}"><input id="step-${i}" type="checkbox" data-step="${i}" ${r.steps[i]?'checked':''}><span class="step-copy"><span class="step-meta"><span class="step-number">${i+1}</span><span class="step-time">${d.stepMinutes[i]} min</span></span><p>${linkPaths(s)}</p></span></label>`).join('')}
   </section>
   ${d.calculation?`<section class="panel calc-panel"><div class="panel-body"><h3>Numbers for today</h3><p class="calc">${esc(d.calculation)}</p></div></section>`:''}
   <section class="panel"><div class="panel-heading"><h2>Done when</h2></div><div class="panel-body">${d.acceptance.map((a,i)=>`<label class="check-row"><input type="checkbox" data-check="${i}" ${r.checks[i]?'checked':''}><span>${esc(a)}</span></label>`).join('')}
    <details class="stop-details"><summary>Stop if…</summary><p>${esc(d.stop)}</p></details>
    ${issues.length?`<div class="alternative"><h3>Blocked today? Do this instead</h3><ol>${d.alternative.map(a=>`<li>${esc(a)}</li>`).join('')}</ol><p>Save <code>${esc(d.alternativeOutput)}</code> and record the task as BLOCKED.</p></div>`:''}
   </div></section>
   ${d.help?`<section class="panel help-panel"><div class="panel-body"><h3>Outside help</h3><p>${esc(d.help)}</p></div></section>`:''}
   <section class="panel notes-panel"><div class="panel-body"><div class="notes-label"><h3>Your notes</h3><small class="muted-small" id="notes-saved">Saved in this browser as you type</small></div><textarea id="day-notes" aria-label="Working notes" placeholder="What did you actually do? What is still unknown? Fictional data only.">${esc(r.notes)}</textarea></div></section>
   <section class="panel"><div class="panel-heading"><h2>Record today's task</h2></div><div class="panel-body">${r.result?`<div class="saved-outcome ${r.result!=='PASS'?'blocked':''}"><strong>${esc(r.result)}</strong> · ${esc(r.recordedAt?r.recordedAt.slice(0,10):'')}<div class="outcome-meta">Evidence: ${esc(r.evidence)}${r.reviewer?' · '+esc(r.reviewer):''}${r.hours!==''?' · '+esc(r.hours)+' h':''}</div></div>`:''}
    <form id="day-outcome"><div class="outcome-grid"><label><span class="field-label">Result</span><select name="result" required><option value="">Choose</option>${['PASS','REWORK','BLOCKED'].map(x=>`<option ${r.result===x?'selected':''}>${x}</option>`).join('')}</select></label><label><span class="field-label">Evidence (file path or record)</span><input name="evidence" value="${esc(r.evidence)}" placeholder="${esc(d.output)}" required maxlength="1500"></label><label><span class="field-label">Hours actually spent</span><input name="hours" type="number" min="0" max="24" step="0.25" value="${esc(r.hours)}" placeholder="2"></label><label><span class="field-label">Your role, reviewer or permit</span><input name="reviewer" value="${esc(r.reviewer)}" placeholder="${conditional?'Required: permit or reviewer reference':'Owner'}" maxlength="1000"></label></div><p class="form-error" id="outcome-error" role="alert"></p><div class="save-row"><button class="button" type="submit">Save task record ${icon('arrow')}</button></div></form></div></section>
   ${d.hardwareRecord?`<section class="panel hw-panel"><div class="panel-heading"><h2>Hardware result</h2><span class="count">Only what the robot actually did</span></div><div class="panel-body"><form id="hw-outcome"><div class="outcome-grid"><label><span class="field-label">Result</span><select name="result"><option value="">Not run</option>${['PASS','FAIL','STOPPED'].map(x=>`<option ${r.hw.result===x?'selected':''}>${x}</option>`).join('')}</select></label><label><span class="field-label">Run ID</span><input name="run" value="${esc(r.hw.run)}" placeholder="e.g. S9-RUN-01" maxlength="200"></label><label><span class="field-label">Run date</span><input name="date" type="date" value="${esc(r.hw.date)}" max="${todayISO()}"></label><label><span class="field-label">Measured values / stops</span><input name="notes" value="${esc(r.hw.notes)}" maxlength="1500" placeholder="e.g. 3 steps, 0.11 m/s, tether 22 N mean"></label></div><p class="form-error" id="hw-error" role="alert"></p><div class="save-row"><button class="button ghost" type="submit">Save hardware result</button></div></form></div></section>`:''}
  </div>
  <aside class="day-aside"><section class="panel"><div class="side-section"><div class="eyebrow">DAY ${String(d.id).padStart(3,'0')} OF 365</div><h3 style="margin-top:6px">${esc(d.weekTitle)}</h3><div class="mini-week">${weekDays.map(x=>`<a class="mini-day ${x.id===selected?'selected':dayState(x.id).result==='PASS'?'passed':dayState(x.id).result?'blocked':''}" href="#day/${x.id}" aria-label="Day ${x.id}: ${esc(x.title)}" ${x.id===selected?'aria-current="date"':''}>${x.id}</a>`).join('')}</div></div>
    <div class="side-section"><h3>Save today's file as</h3><div class="output-file">${esc(d.output)}</div>${d.extraOutputs.length?`<ul class="tight">${d.extraOutputs.map(x=>`<li><code>${esc(x)}</code></li>`).join('')}</ul>`:''}<button class="button text small" data-action="copy-output">Copy file path</button></div>
    <div class="daily-nav"><a class="button ghost small ${selected===1?'hidden':''}" href="#day/${selected-1}">← Previous</a><a class="button ghost small ${selected===365?'hidden':''}" href="#day/${selected+1}">Next →</a></div></section>
   <section class="panel"><div class="side-section"><h3>Inputs</h3><ul>${d.inputs.map(x=>`<li>${linkPaths(x)}</li>`).join('')}</ul></div>
    <div class="side-section"><h3>Builds on</h3><p>${d.dependencyDays.map(dayLink).join(', ')||'Nothing earlier'}</p></div>
    <div class="side-section"><h3>Requirements</h3><div class="tag-list">${d.requirements.map(x=>`<button class="tag" data-action="requirement" data-id="${x}">${x}</button>`).join('')}</div><div class="next-box"><strong>Next</strong>${esc(d.next)}</div></div></section></aside></div>`;
}

function reviewCard(kind,x){const ok=kind==='gate'?gateSatisfied(x.id):stageSatisfied(x.id),r=S[kind==='gate'?'gates':'stages'][x.id],label=ok?'Released':r?.result==='PASS'?'Prerequisites changed':r?.result||'Not reviewed';return `<article class="review-card"><div class="review-top"><span class="review-id">${x.id}</span><span class="pill ${ok?'green':r?.result?'blush':''}">${esc(label)}</span></div><h3>${esc(x.name)}</h3><p>Target ${dayLink(x.day)} · ${fmtDate(dateAt(x.day))}<br>${kind==='gate'?`Needs: ${esc([...x.requires,...x.stages].join(', ')||'owner baseline')}`:`Needs ${esc([x.gate,...x.requires].join(', '))}`}${r?.reviewer?`<br>Reviewer: ${esc(r.reviewer)}`:''}</p><button class="button ghost small" data-action="review" data-kind="${kind}" data-id="${x.id}">${r?'View / update':'Record a review'} →</button></article>`;}

function renderControls(){const b=budgetTotals(),m=massTotals(),over=b.forecast===null?null:b.forecast-cap();return heading('BUDGET AND MASS','Two numbers that decide what gets built.','Enter real figures with sources. Blank means unknown, never zero.')+`<div class="controls-stats"><div class="control-stat"><div class="stat-label">Working cash cap</div><div class="stat-value">${money(cap())}</div><p>${money(D.meta.cashScenario||15000)} is a scenario. ${esc(D.meta.ceilingStatus||'')}.</p></div><div class="control-stat"><div class="stat-label">Projected cash</div><div class="stat-value">${money(b.forecast)}</div><p>${over>0?money(over)+' over the working cap.':over===null?'Some lines missing.':'Within the working cap.'} Actuator line starts from the dated R0.3 listing screen (not a quote).</p></div><div class="control-stat"><div class="stat-label">Actual cash spent</div><div class="stat-value">${money(b.actual)}</div><p>Enter every line, including real zeros.</p></div></div>${over>0?`<div class="notice blush"><strong>Over the working cap by ${money(over)}.</strong> G3 stays closed until quotes, mass and a real review agree.</div>`:''}<div class="section-heading"><h2>Cash lines</h2></div><div class="table-scroll"><table><thead><tr><th>Line</th><th>Projected</th><th>Actual</th><th>Basis / source</th><th></th></tr></thead><tbody>${D.budget.map(r=>{const x=S.costs[r[0]];return `<tr><td>${esc(r[0])} · ${esc(r[1])}<small>${esc(r[4])}</small></td><td class="number">${money(x.forecast)}</td><td class="number">${money(x.actual)}</td><td>${esc(x.kind)}<small>${esc(x.reference||'No quote or receipt yet')}</small></td><td><button class="button ghost small" data-action="cost" data-id="${r[0]}">Update</button></td></tr>`;}).join('')}</tbody></table></div><div class="section-heading"><h2>Robot mass</h2><span class="days-covered">Battery, panels and anything attached count</span></div><div class="controls-stats"><div class="control-stat"><div class="stat-label">Target / major review< function renderSettings(){const avg=Math.round(D.days.reduce((s,d)=>s+d.minutes,0)/365);return heading('SETTINGS','Start date and backups.','Your ticks, notes and records stay in this browser on this device.')+`<section class="panel"><div class="panel-body"><div class="settings-section"><h2>Day 1 date</h2><p>Changing it moves planned dates only. Records stay as they are.</p><form id="settings-form"><label><span class="field-label">Day 1</span><input name="start" type="date" value="${esc(S.start)}" required min="2020-01-01" max="2100-12-31"></label><p>Day 365: <strong>${fmtDate(dateAt(365))}</strong> · ${D.meta.ownerHours} planned hours · average ${hm(avg)} a day.</p><div class="button-row"><button class="button" type="submit">Save start date</button><button class="button ghost" type="button" data-action="today">Open calendar day</button></div></form></div><div class="settings-section"><h2>Backups</h2><p>Export after each weekly review and before switching browsers. R0.2 backups import normally; old step ticks are kept aside because the steps changed.</p><div class="button-row"><button class="button ghost" data-action="backup">Export progress JSON</button><button class="button ghost" data-action="import">Import a backup</button></div></div><div class="settings-section"><h2>What this site does</h2><p>It shows the plan, stores your records and checks that required reviews are recorded. It sends nothing, orders nothing and controls no robot. Owner: Faisal Farouq. Plan ${esc(D.meta.revision)}, ${esc(D.meta.date)}.</p></div></div></section>`;}
function bindView(){if(view==='day'){$('day-notes').addEventListener('input',e=>{dayState(selected).notes=e.target.value;persist();$('notes-saved').textContent=storageOK?'Saved in this browser':'Export a backup — storage unavailable';});$('day-outcome').addEventListener('submit',saveDay);$('hw-outcome')?.addEventListener('submit',saveHw);}if(view==='plan'){for(const [id,key] of [['plan-search','q'],['plan-phase','phase'],['plan-status','status'],['plan-month','month']])$(id).addEventListener(id==='plan-search'?'input':'change',e=>{if(key==='q')planQuery=e.target.value;if(key==='phase')planPhase=e.target.value;if(key==='status')planStatus=e.target.value;if(key==='month')planMonth=e.target.value;$('plan-results').innerHTML=planResults();});}if(view==='register')$('register-search').addEventListener('input',e=>{registryQuery=e.target.value;$('register-results').innerHTML=registerResults();});if(view==='settings')$('settings-form').addEventListener('submit',e=>{e.preventDefault();const start=new FormData(e.target).get('start');if(!validDate(start))return toast('Enter a valid date.');S.start=start;persist();render();toast('Planned dates moved. Records unchanged.');});}
function saveDay(e){e.preventDefault();const f=new FormData(e.target),d=D.days[selected-1],r=dayState(selected),result=f.get('result'),evidence=f.get('evidence').trim(),reviewer=f.get('reviewer').trim();const errors=[];if(result==='PASS'){if(!r.steps.every(Boolean)||!r.checks.every(Boolean))errors.push(`Tick all ${d.steps.length} steps and all ${d.acceptance.length} checks before PASS.`);if(readiness(d).length)errors.push('Required releases are missing. Record BLOCKED and use the desk alternative.');if((d.gates.length||d.stages.length)&&!reviewer)errors.push('Add the permit or reviewer reference.');}if(!evidence)errors.push('Add the evidence file or record.');const h=f.get('hours');if(h!==''&&(!Number.isFinite(Number(h))||Number(h)<0||Number(h)>24))errors.push('Hours must be between 0 and 24.');if(errors.length){$('outcome-error').textContent=errors.join(' ');return;}if(r.result)r.history.push({result:r.result,evidence:r.evidence,reviewer:r.reviewer,recordedAt:r.recordedAt});Object.assign(r,{result,evidence,reviewer,hours:h===''?'':Number(h),recordedAt:new Date().toISOString()});persist();render();toast(result+' saved for Day '+selected+'.');}
function saveHw(e){e.preventDefault();const f=new FormData(e.target),d=D.days[selected-1],r=dayState(selected),result=f.get('result'),run=f.get('run').trim(),date=f.get('date'),notes=f.get('notes').trim();const errors=[];if(result){if(!run)errors.push('Add the run ID.');if(!validDate(date)||date>todayISO())errors.push('Add the real run date.');if(result==='PASS'&&readiness(d).length)errors.push('A hardware PASS needs the required releases recorded first.');}if(errors.length){$('hw-error').textContent=errors.join(' ');return;}if(r.hw.result)r.history.push({hw:{...r.hw},recordedAt:new Date().toISOString()});r.hw={result,run,date:result?date:'',notes};persist();render();toast(result?'Hardware result saved.':'Hardware result cleared.');}

function reviewModal(kind,id){const x=D[kind==='gate'?'gates':'stages'].find(x=>x.id===id),r=S[kind==='gate'?'gates':'stages'][id]||{};let issues=kind==='gate'?gateIssues(id):[...(!gateSatisfied(x.gate)?[x.gate+' has no release']:[]),...x.requires.filter(y=>!stageSatisfied(y)).map(y=>y+' not accepted')];modal(`${id} · ${x.name}`,`<p>Record a decision a real reviewer made. Saving it here does not grant permission.</p>${issues.length?`<div class="notice blush"><strong>Still missing</strong><ul class="blocker-list">${issues.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>PASS can't be saved until these are resolved.</div>`:''}<form id="review-form"><div class="outcome-grid"><label><span class="field-label">Decision</span><select name="result" required><option value="">Choose</option>${['PASS','REWORK','BLOCKED'].map(v=>`<option ${r.result===v?'selected':''}>${v}</option>`).join('')}</select></label><label><span class="field-label">Review date</span><input name="date" type="date" value="${esc(r.date||'')}" required max="${todayISO()}"></label><label><span class="field-label">Reviewer name</span><input name="reviewer" value="${esc(r.reviewer||'')}" required maxlength="200"></label><label><span class="field-label">Their background and scope</span><input name="role" value="${esc(r.role||'')}" required maxlength="500"></label><label class="wide-field"><span class="field-label">Signed record or evidence path</span><input name="evidence" value="${esc(r.evidence||'')}" required maxlength="1500"></label><label class="wide-field"><span class="field-label">Conditions and limits</span><textarea name="notes" maxlength="12000">${esc(r.notes||'')}</textarea></label></div><h3>The evidence covers</h3>${x.checks.map((c,i)=>`<label class="check-row"><input name="c${i}" type="checkbox" ${r.checks?.[i]?'checked':''}><span>${esc(c)}</span></label>`).join('')}<label class="check-row"><input name="reviewed" type="checkbox" ${r.reviewed?'checked':''}><span>The named reviewer made this decision for this exact scope.</span></label><p class="form-error" id="review-error" role="alert"></p><div class="button-row"><button class="button" type="submit">Save review record</button><button class="button ghost" type="button" data-action="open-day" data-day="${x.day}">Open Day ${x.day}</button></div></form>`,'REVIEW RECORD');$('review-form').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target),checks=x.checks.map((_,i)=>f.get('c'+i)==='on'),result=f.get('result'),reviewed=f.get('reviewed')==='on';if(result==='PASS'&&(issues.length||!checks.every(Boolean)||!reviewed)){$('review-error').textContent='PASS needs every evidence box, the reviewer confirmation and all prerequisites.';return;}const date=f.get('date');if(!validDate(date)||date>todayISO()){$('review-error').textContent='Use the real review date.';return;}S[kind==='gate'?'gates':'stages'][id]={result,checks,reviewed,date,reviewer:f.get('reviewer').trim(),role:f.get('role').trim(),evidence:f.get('evidence').trim(),notes:f.get('notes').trim(),updatedAt:new Date().toISOString()};persist();$('dialog').close();render();toast(id+' review saved.');});}
function costModal(id){const base=D.budget.find(r=>r[0]===id),r=S.costs[id];modal(id+' · '+base[1],`<p>Projected total includes anything already spent. Blank actual means unknown; enter 0 only for a real zero.</p><form id="cost-form"><div class="outcome-grid"><label><span class="field-label">Projected total USD</span><input type="number" name="forecast" min="0" max="1000000" step="0.01" value="${esc(r.forecast??'')}" required></label><label><span class="field-label">Actual spent USD</span><input type="number" name="actual" min="0" max="1000000" step="0.01" value="${esc(r.actual??'')}"></label><label><span class="field-label">Basis</span><select name="kind">${['allowance','quote','receipt','confirmed resource','reserve'].map(x=>`<option ${r.kind===x?'selected':''}>${x}</option>`).join('')}</select></label><label><span class="field-label">Source date</span><input name="date" type="date" value="${esc(r.updated||'')}" required max="${todayISO()}"></label><label class="wide-field"><span class="field-label">Quote, receipt or resource reference</span><input name="reference" value="${esc(r.reference)}" required maxlength="1500"></label></div><p class="form-error" id="cost-error"></p><button class="button" type="submit">Save line</button></form>`,'COST');$('cost-form').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target),forecast=Number(f.get('forecast')),a=f.get('actual');if(!Number.isFinite(forecast)||forecast<0)return;S.costs[id]={forecast,actual:a===''?null:Number(a),kind:f.get('kind'),reference:f.get('reference').trim(),updated:f.get('date')};persist();$('dialog').close();render();toast('Budget line saved.');});}

function dayMarkdown(){const d=D.days[selected-1],r=dayState(selected);return `# Day ${d.id} · ${d.title}\n\nPlanned ${isoDate(dateAt(d.id))} · ${d.mode} · ${hm(d.minutes)} · ${D.meta.revision}\n\n**Goal:** ${d.goal}\n\n## Inputs\n${d.inputs.map(x=>'- '+x).join('\n')}\n\n## Steps\n${d.steps.map((s,i)=>`- [${r.steps[i]?'x':' '}] ${i+1}. (${d.stepMinutes[i]} min) ${s}`).join('\n')}\n\n## Numbers\n${d.calculation||'—'}\n\n## Done when\n${d.acceptance.map((s,i)=>`- [${r.checks[i]?'x':' '}] ${s}`).join('\n')}\n\n## Files\n- ${d.output}\n${d.extraOutputs.map(x=>'- '+x).join('\n')}\n\n${d.help?`## Outside help\n${d.help}\n\n`:''}Stop if: ${d.stop}\n\n## Records\n- Task: ${r.result||'not recorded'} ${r.evidence?'· '+r.evidence:''} ${r.hours!==''?'· '+r.hours+' h':''}\n${d.hardwareRecord?`- Hardware: ${r.hw.result||'not run'} ${r.hw.run?'· '+r.hw.run+' · '+r.hw.date:''} ${r.hw.notes}\n`:''}\nNotes: ${r.notes}\n`;}
document.addEventListener('change',e=>{if(!D)return;const t=e.target;if(t.matches('[data-step],[data-check]')){const r=dayState(selected);if(t.hasAttribute('data-step'))r.steps[Number(t.dataset.step)]=t.checked;else r.checks[Number(t.dataset.check)]=t.checked;persist();const active=t.id,scroll=window.scrollY;render();window.scrollTo(0,scroll);if(active)$(active)?.focus({preventScroll:true});}});

function sanitizeImport(x){if(x?.format!=='baymax365-progress'||x.version!==2||x.state?.version!==2||!validDate(x.state.start))throw Error('This is not a Baymax 365 backup.');const n=blankState();n.start=x.state.start;const bool=(a,len)=>Array.from({length:len},(_,i)=>Array.isArray(a)&&a[i]===true);for(const [id,r] of Object.entries(x.state.days||{})){if(!/^\d+$/.test(id)||Number(id)<1||Number(id)>365)continue;const rec={steps:bool(r.steps,8),checks:bool(r.checks,4),notes:String(r.notes||'').slice(0,30000),result:['PASS','REWORK','BLOCKED'].includes(r.result)?r.result:'',evidence:String(r.evidence||'').slice(0,1500),reviewer:String(r.reviewer||'').slice(0,1000),hours:typeof r.hours==='number'&&r.hours>=0&&r.hours<=24?r.hours:'',recordedAt:String(r.recordedAt||'').slice(0,30),history:Array.isArray(r.history)?r.history.slice(-100):[],planRev:typeof r.planRev==='string'?r.planRev.slice(0,10):'R0.2'};if(r.legacy)rec.legacy={rev:String(r.legacy.rev||'R0.2').slice(0,10),steps:bool(r.legacy.steps,8),checks:bool(r.legacy.checks,4)};if(r.hw)rec.hw={result:['PASS','FAIL','STOPPED'].includes(r.hw.result)?r.hw.result:'',run:String(r.hw.run||'').slice(0,200),date:validDate(r.hw.date)?r.hw.date:'',notes:String(r.hw.notes||'').slice(0,1500)};n.days[id]=rec;}for(const kind of ['gates','stages'])for(const def of D[kind]){const r=x.state[kind]?.[def.id];if(!r)continue;n[kind][def.id]={result:['PASS','REWORK','BLOCKED'].includes(r.result)?r.result:'',checks:def.checks.map((_,i)=>r.checks?.[i]===true),reviewed:r.reviewed===true,date:validDate(r.date)?r.date:'',reviewer:String(r.reviewer||'').slice(0,200),role:String(r.role||'').slice(0,500),evidence:String(r.evidence||'').slice(0,1500),notes:String(r.notes||'').slice(0,12000)};}for(const id of Object.keys(n.costs)){const r=x.state.costs?.[id];if(!r)continue;n.costs[id]={forecast:typeof r.forecast==='number'&&r.forecast>=0?r.forecast:null,actual:typeof r.actual==='number'&&r.actual>=0?r.actual:null,kind:['allowance','quote','receipt','confirmed resource','reserve'].includes(r.kind)?r.kind:'allowance',reference:String(r.reference||'').slice(0,1500),updated:validDate(r.updated)?r.updated:''};}for(const id of Object.keys(n.masses)){const r=x.state.masses?.[id];if(!r)continue;n.masses[id]={estimate:typeof r.estimate==='number'&&r.estimate>=0?r.estimate:null,measured:typeof r.measured==='number'&&r.measured>=0?r.measured:null,reference:String(r.reference||'').slice(0,1500),updated:validDate(r.updated)?r.updated:''};}return n;}
